<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #c9d3d8; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  p { position: fixed; bottom: 16px; width: 100%; margin: 0; text-align: center;
      font: 13px/1 system-ui, sans-serif; color: #6b7a82; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<p id="caption">Drag to turn</p>
<script type="module" src="./view.ts"></script>
</body>
</html>
